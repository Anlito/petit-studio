<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Petit Studio</title>
<meta name="description" content="Pad musical à boucles pour enfants">
<meta name="theme-color" content="#fff7ea">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Petit Studio">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700&display=swap">
<style>
:root{
  --screen:#fff7ea; --ink:#2b2140; --ink-soft:#7a6f8f; --tray:#f3e6d0; --card:#ffffff; --blue:#4a4fd8;
  --display:'Baloo 2','Trebuchet MS','Arial Rounded MT Bold',system-ui,sans-serif;
  --body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--screen);color:var(--ink);font-family:var(--body);overflow-x:hidden;
  touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
h2{font-family:var(--display);font-weight:700;margin:0;line-height:1.1}

/* Paysage : instruments | boucle, puis Mes sons | Mes musiques. Portrait : tout empilé. */
.app{min-height:100%;display:grid;gap:12px;
  padding:max(12px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));
  grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;
  grid-template-areas:"top top" "pads loop" "mine songs"}
@media (orientation:portrait){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1.3fr) minmax(0,1fr) auto auto;
    grid-template-areas:"top" "pads" "loop" "mine" "songs"}
}

.topbar{grid-area:top;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{font-family:var(--display);font-weight:800;font-size:clamp(1.3rem,3.2vmin,1.9rem);margin-right:auto}
.logo span{color:#ff6b6b}
.play{width:68px;height:68px;border-radius:50%;border:0;background:#2fbf71;color:#fff;font-size:1.8rem;cursor:pointer;box-shadow:0 5px 0 #1f8a50;display:grid;place-items:center}
.play.on{background:#ff6b6b;box-shadow:0 5px 0 #c94848}
.play:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.25)}
.tempo{display:flex;gap:6px;background:var(--tray);padding:6px;border-radius:999px}
.tempo button{border:0;background:transparent;font-size:1.7rem;width:56px;height:56px;border-radius:50%;cursor:pointer;opacity:.45}
.tempo button.sel{background:#fff;opacity:1;box-shadow:0 3px 0 rgba(0,0,0,.12)}

.padzone{grid-area:pads;display:flex;flex-direction:column;gap:10px;min-height:0;min-width:0}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cat{border:0;border-radius:18px;padding:6px 4px;background:#fff;font-family:var(--display);font-weight:700;font-size:clamp(.85rem,2vmin,1.05rem);
  display:flex;flex-direction:column;align-items:center;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.08);line-height:1.15}
.cat .ico{font-size:clamp(1.4rem,3.4vmin,2rem);line-height:1.1}
.cat.sel{background:var(--cc);color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.2)}
.pads{flex:1;min-height:230px;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(2,1fr);gap:10px}
.pad{border:0;border-radius:24px;cursor:pointer;color:#fff;font-family:var(--display);font-weight:700;font-size:clamp(.85rem,2.1vmin,1.15rem);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;box-shadow:0 6px 0 rgba(0,0,0,.18);transition:transform .08s}
.pad .ico{font-size:clamp(1.9rem,6vmin,3.4rem);line-height:1}
.pad.hit{transform:scale(.92) translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.18);filter:brightness(1.12)}

.loop{grid-area:loop;background:var(--card);border-radius:22px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0;min-height:0;overflow:auto}
.loophead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.add{border:0;background:var(--blue);color:#fff;font-family:var(--display);font-weight:700;font-size:1.05rem;padding:10px 18px;border-radius:999px;cursor:pointer;box-shadow:0 4px 0 #3135a0}
.add.on{background:#ffb020;box-shadow:0 4px 0 #c78400;color:var(--ink)}
.add.full{background:#c9c2d6;box-shadow:0 4px 0 #a39bb3;font-size:1.5rem;padding:4px 22px}
.loop.nope{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.nope .del{animation:blink .4s 4 alternate}
@keyframes blink{to{background:#ff4d4d;color:#fff;transform:scale(1.3)}}
.lanes{display:flex;flex-direction:column;gap:8px}
.lane{display:grid;grid-template-columns:44px minmax(0,1fr) 34px;align-items:center;gap:8px}
.lane .li{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:1.4rem;color:#fff}
.steps{display:grid;grid-template-columns:repeat(8,minmax(0,52px));gap:5px}
.step{aspect-ratio:1;width:100%;border-radius:50%;border:3px solid var(--c);background:transparent;cursor:pointer;padding:0}
.step.on{background:var(--c)}
.step:nth-child(4n+1){border-width:4px}
.step.now{transform:scale(1.18);box-shadow:0 0 0 3px #ffd84d}
.del{border:0;background:var(--tray);color:var(--ink-soft);width:34px;height:34px;border-radius:50%;cursor:pointer;font-weight:700}
.empty{color:var(--ink-soft);padding:8px 2px}
.hint{font-size:.85rem;color:var(--ink-soft)}

.bar{display:flex;align-items:center;gap:12px;border-radius:22px;padding:10px 14px;flex-wrap:wrap;min-width:0}
.bar h2{font-size:1.1rem}
.mine{grid-area:mine;background:var(--tray)}
.songs{grid-area:songs;background:var(--card)}
.slots{display:flex;gap:12px;flex-wrap:wrap}
.holder{position:relative}
.slot{width:62px;height:62px;border-radius:50%;border:3px dashed #c9b48f;background:#fff8ee;cursor:pointer;font-size:1.6rem;display:grid;place-items:center;color:var(--ink-soft)}
.slot.full{border-style:solid;border-color:transparent;color:#fff;background:var(--sc)}
.sbtn{min-width:104px;height:62px;border-radius:18px;border:3px dashed #c9b48f;background:#fff8ee;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;
  padding:0 12px;font-size:1.6rem;color:var(--ink-soft);font-family:var(--display);font-weight:700}
.sbtn.full{border-style:solid;border-color:transparent;background:var(--sc);color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.18)}
.sbtn .mini{font-size:1rem;display:flex;gap:2px;background:rgba(255,255,255,.3);border-radius:10px;padding:2px 6px}
.saved{animation:pop .45s}
@keyframes pop{50%{transform:scale(1.14)}}
.x{position:absolute;top:-9px;right:-9px;width:30px;height:30px;border-radius:50%;border:0;background:#fff;box-shadow:0 2px 0 rgba(0,0,0,.15);cursor:pointer;font-weight:700;color:var(--ink-soft);font-size:.9rem}
.x.arm{background:#ff4d4d;color:#fff}
.slot.hit,.sbtn.hit{transform:scale(.9)}

.banner{position:fixed;left:50%;top:max(12px,env(safe-area-inset-top));transform:translateX(-50%);background:#ffb020;color:var(--ink);font-family:var(--display);font-weight:700;
  font-size:1.15rem;padding:10px 22px;border-radius:999px;box-shadow:0 4px 0 #c78400;z-index:5;max-width:90vw;text-align:center}
.choosing .pad,.choosing .slot.full{animation:wig .5s infinite alternate}
@keyframes wig{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}

.toast{position:fixed;left:50%;bottom:max(16px,env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;font-weight:700;
  padding:12px 20px;border-radius:16px;z-index:6;max-width:90vw;text-align:center}

.rec{position:fixed;inset:0;background:rgba(43,33,64,.82);z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;color:#fff}
.recnum{width:min(46vmin,260px);height:min(46vmin,260px);border-radius:50%;background:#fff;color:var(--ink);display:grid;place-items:center;
  font-family:var(--display);font-weight:800;font-size:min(24vmin,130px)}
.rec.live .recnum{background:#ff4d4d;color:#fff;animation:beat .5s infinite alternate}
@keyframes beat{to{transform:scale(1.08)}}
.recmsg{font-family:var(--display);font-weight:700;font-size:2rem;min-height:2.4rem}

@media (prefers-reduced-motion:reduce){.choosing .pad,.choosing .slot.full,.rec.live .recnum,.saved,.loop.nope{animation:none}.pad{transition:none}}
[hidden]{display:none!important}
</style>
</head>
<body>
<main class="app" id="app">
  <div class="topbar">
    <div class="logo">Petit <span>Studio</span></div>
    <div class="tempo" role="group" aria-label="Vitesse">
      <button data-bpm="80" aria-label="Lent">🐢</button>
      <button data-bpm="110" aria-label="Moyen">🐇</button>
      <button data-bpm="140" aria-label="Rapide">🐆</button>
    </div>
    <button class="play" id="play" aria-label="Lancer la boucle">▶</button>
  </div>

  <div class="padzone">
    <div class="cats" id="cats" role="tablist" aria-label="Rubriques de sons"></div>
    <div class="pads" id="pads"></div>
  </div>

  <section class="loop">
    <div class="loophead">
      <h2>Ma boucle</h2>
      <button class="add" id="add">＋ Ajouter</button>
    </div>
    <div class="lanes" id="lanes"></div>
    <div class="hint">Touche les ronds pour ajouter ou enlever un son.</div>
  </section>

  <section class="bar mine">
    <h2>Mes sons</h2>
    <div class="slots" id="slots"></div>
  </section>

  <section class="bar songs">
    <h2>Mes musiques</h2>
    <div class="slots" id="songs"></div>
  </section>
</main>

<div class="banner" id="banner" hidden>Touche un son pour l’ajouter à la boucle</div>
<div class="toast" id="toast" hidden></div>
<div class="rec" id="rec" hidden>
  <div class="recnum" id="recnum">3</div>
  <div class="recmsg" id="recmsg"></div>
</div>

<script src="app.js"></script>
<script>
if('serviceWorker' in navigator){ window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{})); }
</script>
</body>
</html>
